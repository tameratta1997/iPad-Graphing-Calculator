{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-title">📦 InventorySys</div>
            <nav>
                <a href="{% url 'dashboard' %}"
                    class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'product_list' %}"
                    class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                    Products
                </a>
                <a href="{% url 'category_list' %}"
                    class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
                    Categories
                </a>
                <a href="#" class="nav-link">Sales (Soon)</a>
                <a href="#" class="nav-link">Reports (Soon)</a>
                <a href="#" class="nav-link">Users</a>
            </nav>
            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid #374151;">
                <div style="font-size: 0.875rem; color: #9CA3AF;">
                    Logged in as <br>
                    <strong style="color: white;">{{ request.user.username }}</strong>
                </div>
                <a href="/admin/logout/" class="nav-link" style="color: #F87171; margin-top: 0.5rem;">Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% if messages %}
            <div class="messages mb-4">
                {% for message in messages %}
                <div class="card"
                    style="padding: 1rem; background-color: #EEF2FF; border-left: 4px solid var(--primary-color);">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
